<div class="financial-header container">
  <div class="financial-title">
    {{ data.name || "" }}
    <br />

    <span *ngIf="quoteValue">
      - {{ quoteValue | currency : "BRL" }}
    </span>

    <span *ngIf="isMobile">
      <span class="white">-</span>
      {{ data.describe }}
    </span>
  </div>

  <div class="financial-actions">

    <!-- ADD -->
    <button
      mat-mini-fab
      color="primary"
      (click)="add()"
      matTooltip="Adicionar registro"
      [disabled]="simulationActive"
    >
      <mat-icon>add</mat-icon>
    </button>

    <!-- SIMULAR -->
    <button
      mat-mini-fab
      color="primary"
      (click)="simulate()"
      matTooltip="Simular projeção"
      [disabled]="simulationActive"
    >
      <mat-icon>insights</mat-icon>
    </button>

    <!-- LIMPAR SIMULAÇÃO -->
    <button
      *ngIf="simulationActive"
      mat-mini-fab
      color="warn"
      (click)="clearSimulation()"
      matTooltip="Limpar simulação"
    >
      <mat-icon>refresh</mat-icon>
    </button>

  </div>
</div>

<div class="table-container">

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

    <!-- DATA -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef> Data </th>

      <td mat-cell *matCellDef="let element">
        {{ element.date | date : "MM/yyyy" }}
      </td>
    </ng-container>

    <!-- DESCRIÇÃO -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef> Descrição </th>

      <td mat-cell *matCellDef="let element">
        {{ element.description }}
      </td>
    </ng-container>

    <!-- VALOR -->
    <ng-container matColumnDef="value">
      <th mat-header-cell *matHeaderCellDef> Valor </th>

      <td mat-cell *matCellDef="let element">
        {{ element.value | currency : "BRL" }}
      </td>
    </ng-container>

    <!-- AÇÕES -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>

      <td mat-cell *matCellDef="let element">

        <!-- EDITAR -->
        <button
          mat-icon-button
          color="primary"
          (click)="edit(element)"
          [disabled]="simulationActive"
        >
          <mat-icon>edit</mat-icon>
        </button>

        <!-- EXCLUIR -->
        <button
          mat-icon-button
          color="warn"
          (click)="delete(element)"
          [disabled]="simulationActive"
        >
          <mat-icon>delete</mat-icon>
        </button>

      </td>
    </ng-container>

    <!-- HEADER -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <!-- ROW -->
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  </table>

</div>
