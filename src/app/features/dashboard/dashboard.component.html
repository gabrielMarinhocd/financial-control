<mat-sidenav-container class="sidenav-container">
  <!-- MENU -->
  <mat-sidenav #drawer mode="side" opened>
    <h3 class="menu-title">Tabelas</h3>

    <mat-nav-list>
      <mat-list-item
        *ngFor="let table of tables"
        (click)="selectTable(table)"
        class="menu-item"
      >
        {{ table.name }}
      </mat-list-item>
    </mat-nav-list>
  </mat-sidenav>

  <!-- CONTEÚDO -->
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <div class="toolbar-content">
        <div class="toolbar-left">
          <button mat-icon-button (click)="drawer.toggle()">
            <mat-icon>menu</mat-icon>
          </button>

          <span class="toolbar-title">
            {{ selectedTable?.name }}
          </span>
        </div>

        <div class="toolbar-right">
          <button mat-raised-button color="accent" (click)="addTable()">
            <mat-icon>add</mat-icon>
            Nova Tabela
          </button>
        </div>
      </div>
    </mat-toolbar>

    <div class="container">
      <mat-card class="financial-card mat-elevation-z4" *ngIf="selectedTable">
        <mat-card-content>
          <app-table-financial [data]="selectedTable"> </app-table-financial>
        </mat-card-content>
      </mat-card>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
